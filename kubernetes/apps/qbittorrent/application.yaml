apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: qbittorrent
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/tbalazs3/media-server.git
    targetRevision: HEAD
    path: kubernetes/apps/qbittorrent

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
